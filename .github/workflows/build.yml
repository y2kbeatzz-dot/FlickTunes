name: Build RIFT IPA and DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  # Keep one current build instead of accumulating releases/jobs when
  # several fixes are pushed close together.
  group: flicktunes-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodegen --version
      - name: Run flick gesture and Portal protocol smoke tests
        run: |
          swiftc -o /tmp/flicktunes-smoke-tests \
            Sources/iOS/FlickSignalDetector.swift \
            Sources/Shared/PortalTransfer.swift \
            tests/main.swift
          /tmp/flicktunes-smoke-tests
      - name: Build unsigned IPA and DMG
        run: bash scripts/build_artifacts.sh
      - name: Verify packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/RIFT-macOS.dmg
          test -s dist/RIFT-iOS-UNSIGNED.ipa
          (cd dist && shasum -a 256 RIFT-macOS.dmg RIFT-iOS-UNSIGNED.ipa > SHA256SUMS.txt)
          ls -lh dist/
      # Deliberately do not use actions/upload-artifact: the repository has
      # hit the GitHub Actions artifact storage quota. Release assets are
      # downloaded directly from Releases instead of Actions/Artifacts.
      - name: Publish downloadable IPA and DMG to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_title="RIFT ${GITHUB_REF_NAME}"
            prerelease_flag=()
          else
            # A unique tag per run/attempt avoids release asset collisions,
            # including when GitHub release immutability is enabled.
            release_tag="build-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            release_title="RIFT Build #${GITHUB_RUN_NUMBER}"
            prerelease_flag=(--prerelease)
          fi

          cat > dist/RELEASE_NOTES.md <<EOF
          RIFT v0.9.0 launch candidate from commit ${GITHUB_SHA}.

          - RIFT-macOS.dmg: macOS app, ad-hoc signed for app integrity, but NOT Developer ID signed or notarized. macOS Gatekeeper can block launch; see README for verification and narrowly scoped approval instructions.
          - RIFT-iOS-UNSIGNED.ipa: unsigned iPhone build. It cannot be
            installed directly on a real iPhone until it is signed for your device.
            Open the project in Xcode and sign the iOS target using your Apple ID.
          - SHA256SUMS.txt: file checksums.

          Real iPhone-to-Mac Apple Music handoff still needs
          testing on devices. The Mac can only match tracks in its Music library.
          EOF

          files=(
            dist/RIFT-macOS.dmg
            dist/RIFT-iOS-UNSIGNED.ipa
            dist/SHA256SUMS.txt
          )
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${files[@]}" --clobber
          else
            gh release create "${release_tag}" "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file dist/RELEASE_NOTES.md \
              "${prerelease_flag[@]}"
          fi
          release_url="$(gh release view "${release_tag}" --json url --jq '.url')"
          echo "Published build at ${release_url}"
          {
            echo "## RIFT download"
            echo ""
            echo "[Download the macOS DMG and unsigned iOS IPA](${release_url})"
            echo ""
            echo "**Note:** The iPhone IPA is unsigned and requires device signing."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove superseded development releases and their assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_tag="build-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          # Only touch our historical, automatically generated build releases.
          # Keep the freshly published RIFT release and every named v* release.
          echo "Preserving current release: ${current_tag}"
          while IFS= read -r tag; do
            if [[ "${tag}" =~ ^build-[0-9]+-attempt-[0-9]+$ ]] && [[ "${tag}" != "${current_tag}" ]]; then
              echo "Removing superseded development release and assets: ${tag}"
              if ! gh release delete "${tag}" --yes --cleanup-tag; then
                echo "::warning::Could not remove old release ${tag}; it can be removed from Releases."
              fi
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

