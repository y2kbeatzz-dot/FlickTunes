name: Build FlickTunes IPA and DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: flicktunes-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodegen --version
      - name: Build unsigned IPA and DMG
        run: bash scripts/build_artifacts.sh
      - name: Verify packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/FlickTunes-macOS.dmg
          test -s dist/FlickTunes-iOS-UNSIGNED.ipa
          (cd dist && shasum -a 256 FlickTunes-macOS.dmg FlickTunes-iOS-UNSIGNED.ipa > SHA256SUMS.txt)
          ls -lh dist/
      # Deliberately do not use actions/upload-artifact: the repository has
      # hit the GitHub Actions artifact storage quota. Release assets are
      # downloaded directly from Releases instead of Actions/Artifacts.
      - name: Publish downloadable IPA and DMG to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_title="FlickTunes ${GITHUB_REF_NAME}"
            prerelease_flag=()
          else
            # A unique tag per run/attempt avoids release asset collisions,
            # including when GitHub release immutability is enabled.
            release_tag="build-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            release_title="FlickTunes Development Build #${GITHUB_RUN_NUMBER}"
            prerelease_flag=(--prerelease)
          fi

          cat > dist/RELEASE_NOTES.md <<EOF
          FlickTunes experimental build from commit ${GITHUB_SHA}.

          - FlickTunes-macOS.dmg: macOS app, unsigned and not notarized.
          - FlickTunes-iOS-UNSIGNED.ipa: unsigned iPhone build. It cannot be
            installed directly on a real iPhone until it is signed for your device.
            Open the project in Xcode and sign the iOS target using your Apple ID.
          - SHA256SUMS.txt: file checksums.

          This is a prototype; actual iPhone-to-Mac Apple Music handoff needs
          testing on devices. The Mac can only match tracks in its Music library.
          EOF

          files=(
            dist/FlickTunes-macOS.dmg
            dist/FlickTunes-iOS-UNSIGNED.ipa
            dist/SHA256SUMS.txt
          )
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${files[@]}" --clobber
          else
            gh release create "${release_tag}" "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file dist/RELEASE_NOTES.md \
              "${prerelease_flag[@]}"
          fi
          release_url="$(gh release view "${release_tag}" --json url --jq '.url')"
          echo "Published build at ${release_url}"
          {
            echo "## FlickTunes download"
            echo ""
            echo "[Download the macOS DMG and unsigned iOS IPA](${release_url})"
            echo ""
            echo "**Note:** The iPhone IPA is unsigned and requires device signing."
          } >> "${GITHUB_STEP_SUMMARY}"
